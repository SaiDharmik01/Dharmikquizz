<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dharmik Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- LOGIN PAGE -->
    <div class="auth-container" id="authPage">
        <div class="auth-card">

            <div class="logo">ॐ</div>

            <h1>DHARMIK QUIZ</h1>
            <p class="subtitle">Test Your Knowledge</p>

            <div id="loginForm">
                <h2>Welcome Back</h2>

                <input type="email" id="loginEmail" placeholder="Email Address">
                <input type="password" id="loginPassword" placeholder="Password">

                <button class="main-btn" onclick="login()">LOGIN</button>

                <p class="switch">
                    New user?
                    <span onclick="showRegister()">Create Account</span>
                </p>
            </div>

            <!-- REGISTER -->
            <div id="registerForm" class="hidden">
                <h2>Create Account</h2>

                <input type="text" id="registerName" placeholder="Your Name">
                <input type="email" id="registerEmail" placeholder="Email Address">
                <input type="password" id="registerPassword" placeholder="Password">

                <button class="main-btn" onclick="register()">REGISTER</button>

                <p class="switch">
                    Already have an account?
                    <span onclick="showLogin()">Login</span>
                </p>
            </div>

        </div>
    </div>


    <!-- QUIZ PAGE -->
    <div class="quiz-container hidden" id="quizPage">

        <div class="quiz-header">
            <span>ॐ DHARMIK QUIZ</span>
            <button class="logout-btn" onclick="logout()">LOGOUT</button>
        </div>

        <h1>Test Your Knowledge</h1>

        <div class="progress" id="progress"></div>

        <h2 id="question">Question goes here</h2>

        <div id="options"></div>

        <button id="nextBtn">NEXT</button>

    </div>
<!-- RESULTS PAGE -->
<div class="results-container hidden" id="resultsPage">

    <div class="trophy">🏆</div>

    <h1>QUIZ COMPLETED!</h1>

    <p class="result-message" id="resultMessage">
        Great Job!
    </p>

    <div class="score-circle">
        <span id="finalScore">0/10</span>
    </div>

    <h2 id="percentage">0%</h2>

    <div class="result-stats">

        <div class="stat correct">
            <span>✅</span>
            <strong id="correctCount">0</strong>
            <p>Correct</p>
        </div>

        <div class="stat wrong">
            <span>❌</span>
            <strong id="wrongCount">0</strong>
            <p>Wrong</p>
        </div>

    </div>

    <button class="main-btn" onclick="reviewAnswers()">
        REVIEW ANSWERS
    </button>

    <button class="play-again-btn" onclick="playAgain()">
        🔄 PLAY AGAIN
    </button>

    <button class="logout-result-btn" onclick="logout()">
        LOGOUT
    </button>

</div>

    <script src="script.js"></script>

</body>
</html>
